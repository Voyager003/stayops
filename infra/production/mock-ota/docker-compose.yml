name: stayops-mock-ota

services:
  mock-ota-app:
    image: ${MOCK_OTA_IMAGE:-ghcr.io/voyager003/stayops-mock-ota:latest}
    environment:
      SPRING_MONGODB_URI: mongodb://mock-ota-mongodb:27017/mock-ota
      MOCK_OTA_PMS_WEBHOOK_URL: ${MOCK_OTA_PMS_WEBHOOK_URL}
    depends_on:
      mock-ota-mongodb:
        condition: service_healthy
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - stayops-mock-ota

  mock-ota-mongodb:
    image: mongo:8
    volumes:
      - mock_ota_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - stayops-mock-ota

  nginx:
    image: nginx:alpine
    environment:
      MOCK_OTA_DOMAIN: ${MOCK_OTA_DOMAIN:-mock-ota.stayops.internal}
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${MOCK_OTA_HTPASSWD_PATH:-./.htpasswd}:/etc/nginx/.htpasswd:ro
    depends_on:
      - mock-ota-app
    restart: unless-stopped
    networks:
      - stayops-mock-ota

volumes:
  mock_ota_mongodb_data:

networks:
  stayops-mock-ota:
    driver: bridge
