global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: stayops-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app-1.stayops.internal:8080
          - app-2.stayops.internal:8080

  - job_name: node
    static_configs:
      - targets:
          - app-1.stayops.internal:9100
          - app-2.stayops.internal:9100
          - redis.stayops.internal:9100
          - mock-ota.stayops.internal:9100
          - mongo-1.stayops.internal:9100
          - mongo-2.stayops.internal:9100
          - mongo-3.stayops.internal:9100
          - localhost:9100

  - job_name: mongodb
    static_configs:
      - targets:
          - mongo-1.stayops.internal:9216
          - mongo-2.stayops.internal:9216
          - mongo-3.stayops.internal:9216

  - job_name: redis
    static_configs:
      - targets:
          - redis.stayops.internal:9121
