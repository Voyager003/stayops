name: stayops-app

services:
  prometheus:
    image: prom/prometheus:latest
    entrypoint:
      - /bin/sh
      - -c
    command:
      - 'sed -e "s|\$${MONGO1_HOST}|$${MONGO1_HOST}|g" -e "s|\$${MONGO2_HOST}|$${MONGO2_HOST}|g" -e "s|\$${MONGO3_HOST}|$${MONGO3_HOST}|g" /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --web.enable-lifecycle --web.enable-remote-write-receiver'
    environment:
      MONGO1_HOST: ${MONGO1_HOST}
      MONGO2_HOST: ${MONGO2_HOST}
      MONGO3_HOST: ${MONGO3_HOST}
      MONGO_HOST: ${MONGO_HOST:-}
      MONGO_EXPORTER_HOST: ${MONGO_EXPORTER_HOST:-}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH:-./prometheus.yml}:/etc/prometheus/prometheus.yml.tmpl:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - stayops-app

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - stayops-app

  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      HOSTNAME: app
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - stayops-app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - stayops-app

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - stayops-app

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  stayops-app:
    driver: bridge
