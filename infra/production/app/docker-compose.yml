name: stayops-app

services:
  app:
    image: ${STAYOPS_IMAGE:-ghcr.io/voyager003/stayops:latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:?set shared Redis host}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      STAYOPS_INSTANCE_ID: ${STAYOPS_INSTANCE_ID:-app}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      STAYOPS_PAYMENT_GATEWAY: ${STAYOPS_PAYMENT_GATEWAY:-toss}
      STAYOPS_PAYMENT_LOADTEST_LATENCY_MS: ${STAYOPS_PAYMENT_LOADTEST_LATENCY_MS:-0}
      MOCK_OTA_ENDPOINT: ${MOCK_OTA_ENDPOINT}
      MOCK_OTA_BASIC_AUTH_USERNAME: ${MOCK_OTA_BASIC_AUTH_USERNAME:-}
      MOCK_OTA_BASIC_AUTH_PASSWORD: ${MOCK_OTA_BASIC_AUTH_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 40s
    networks:
      - stayops-app

networks:
  stayops-app:
    driver: bridge
