name: stayops-app

services:
  app:
    image: ${STAYOPS_IMAGE:-ghcr.io/voyager003/stayops:latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:?set shared Redis host}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      STAYOPS_INSTANCE_ID: ${STAYOPS_INSTANCE_ID:-app}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      STAYOPS_PAYMENT_GATEWAY: ${STAYOPS_PAYMENT_GATEWAY:-toss}
      STAYOPS_PAYMENT_LOADTEST_LATENCY_MS: ${STAYOPS_PAYMENT_LOADTEST_LATENCY_MS:-0}
      MOCK_OTA_ENDPOINT: ${MOCK_OTA_ENDPOINT}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - stayops-app

  mock-ota-app:
    image: ${MOCK_OTA_IMAGE:-ghcr.io/voyager003/stayops-mock-ota:latest}
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mock-ota-mongodb:27017/mock-ota
      MOCK_OTA_PMS_WEBHOOK_URL: ${MOCK_OTA_PMS_WEBHOOK_URL}
    depends_on:
      mock-ota-mongodb:
        condition: service_healthy
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - stayops-app

  mock-ota-mongodb:
    image: mongo:8
    volumes:
      - mock_ota_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - stayops-app

  nginx:
    image: nginx:alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${MOCK_OTA_HTPASSWD_PATH:-./.htpasswd}:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
      - mock-ota-app
    restart: unless-stopped
    networks:
      - stayops-app

volumes:
  mock_ota_mongodb_data:

networks:
  stayops-app:
    driver: bridge
