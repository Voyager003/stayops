server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: host
        replacement: ${HOSTNAME}
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
*** Add File: infra/production/observability/docker-compose.yml
name: stayops-observability

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    extra_hosts:
      - "app1:${APP1_HOST}"
      - "app2:${APP2_HOST}"
      - "redis:${REDIS_HOST}"
      - "mock-ota:${MOCK_OTA_HOST}"
      - "mongo1:${MONGO1_HOST}"
      - "mongo2:${MONGO2_HOST}"
      - "mongo3:${MONGO3_HOST}"
    networks:
      - stayops-observability

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - stayops-observability

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - stayops-observability

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - stayops-observability

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  stayops-observability:
    driver: bridge
