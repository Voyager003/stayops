name: stayops-mock-ota

services:
  mock-ota-app:
    image: ${MOCK_OTA_IMAGE:-ghcr.io/voyager003/stayops-mock-ota:latest}
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mock-ota-mongodb:27017/mock-ota
      MOCK_OTA_PMS_WEBHOOK_URL: ${MOCK_OTA_PMS_WEBHOOK_URL}
    depends_on:
      mock-ota-mongodb:
        condition: service_healthy
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - mock-ota

  mock-ota-mongodb:
    image: mongo:8
    volumes:
      - mock_ota_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - mock-ota

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${MOCK_OTA_HTPASSWD_PATH:-./.htpasswd}:/etc/nginx/.htpasswd:ro
    depends_on:
      - mock-ota-app
    restart: unless-stopped
    networks:
      - mock-ota

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - mock-ota

  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: ${LOKI_URL}
      HOSTNAME: mock-ota
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail.yml:/etc/promtail/config.yml:ro
    restart: unless-stopped
    networks:
      - mock-ota

volumes:
  mock_ota_mongodb_data:

networks:
  mock-ota:
    driver: bridge
