name: stayops-boot

services:
  app:
    image: ${STAYOPS_IMAGE:-ghcr.io/voyager003/stayops:latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      MOCK_OTA_ENDPOINT: ${MOCK_OTA_ENDPOINT}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - stayops-boot

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - stayops-boot

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stayops-boot

  mongo-arbiter:
    image: mongo:8
    command: ["mongod", "--replSet", "${MONGO_REPLICA_SET:-rs0}", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_arbiter_data:/data/db
    restart: unless-stopped
    networks:
      - stayops-boot

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--config.expand-env=true"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    environment:
      MONGO1_HOST: ${MONGO1_HOST}
      MONGO2_HOST: ${MONGO2_HOST}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - stayops-boot

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - stayops-boot

  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      HOSTNAME: boot
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - stayops-boot

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - stayops-boot

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - stayops-boot

volumes:
  redis_data:
  mongo_arbiter_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  stayops-boot:
    driver: bridge
