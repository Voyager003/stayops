name: stayops-app

services:
  app:
    image: ${STAYOPS_IMAGE:-ghcr.io/voyager003/stayops:latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      STAYOPS_PAYMENT_GATEWAY: ${STAYOPS_PAYMENT_GATEWAY:-toss}
      STAYOPS_PAYMENT_LOADTEST_LATENCY_MS: ${STAYOPS_PAYMENT_LOADTEST_LATENCY_MS:-0}
      MOCK_OTA_ENDPOINT: ${MOCK_OTA_ENDPOINT}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - stayops-app

  mock-ota-app:
    image: ${MOCK_OTA_IMAGE:-ghcr.io/voyager003/stayops-mock-ota:latest}
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mock-ota-mongodb:27017/mock-ota
      MOCK_OTA_PMS_WEBHOOK_URL: ${MOCK_OTA_PMS_WEBHOOK_URL}
    depends_on:
      mock-ota-mongodb:
        condition: service_healthy
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - stayops-app

  mock-ota-mongodb:
    image: mongo:8
    volumes:
      - mock_ota_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - stayops-app

  nginx:
    image: nginx:alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${MOCK_OTA_HTPASSWD_PATH:-./.htpasswd}:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
      - mock-ota-app
    restart: unless-stopped
    networks:
      - stayops-app

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stayops-app

  prometheus:
    image: prom/prometheus:latest
    entrypoint:
      - /bin/sh
      - -c
    command:
      - 'sed -e "s|\$${MONGO1_HOST}|$${MONGO1_HOST}|g" -e "s|\$${MONGO2_HOST}|$${MONGO2_HOST}|g" -e "s|\$${MONGO3_HOST}|$${MONGO3_HOST}|g" /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --web.enable-lifecycle --web.enable-remote-write-receiver'
    environment:
      MONGO1_HOST: ${MONGO1_HOST}
      MONGO2_HOST: ${MONGO2_HOST}
      MONGO3_HOST: ${MONGO3_HOST}
      MONGO_HOST: ${MONGO_HOST:-}
      MONGO_EXPORTER_HOST: ${MONGO_EXPORTER_HOST:-}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH:-./prometheus.yml}:/etc/prometheus/prometheus.yml.tmpl:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - stayops-app

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - stayops-app

  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      HOSTNAME: app
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - stayops-app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - stayops-app

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - stayops-app

volumes:
  redis_data:
  mock_ota_mongodb_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  stayops-app:
    driver: bridge
