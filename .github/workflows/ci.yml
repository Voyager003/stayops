name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-destroy.yml'
      - '.github/workflows/bootstrap-deploy.yml'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}
          restore-keys: docker-${{ runner.os }}-

      - name: Start MongoDB and Redis
        run: docker compose up -d mongodb mongo-init redis && sleep 5

      - name: Download dependencies
        run: ./gradlew :apps:stayops-api:dependencies :apps:mock-ota:dependencies --no-daemon

      - name: Run tests
        run: ./gradlew test --build-cache --no-daemon
