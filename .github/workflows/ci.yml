name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Docker
        run: docker info && docker version

      - run: ./gradlew test --build-cache --info 2>&1 | grep -E "Testcontainers|Container|mongo|redis|DynamicProperty|profiles|FAILED|BUILD" | tail -100
