name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'infra/terraform/**'
      - 'infra/minimal/**/env.example'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-destroy.yml'
      - '.github/workflows/bootstrap-deploy.yml'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml', 'docker-compose.mongo.yml') }}
          restore-keys: docker-${{ runner.os }}-

      - name: Show Docker environment
        run: |
          docker version
          docker info

      - name: Start MongoDB and Redis
        run: docker compose -f docker-compose.yml -f docker-compose.mongo.yml up -d mongodb mongo-init redis && sleep 5

      - name: Download dependencies
        run: ./gradlew :apps:stayops-api:dependencies :apps:mock-ota:dependencies --no-daemon

      - name: Run tests
        run: ./gradlew test --build-cache --no-daemon

      - name: Show container state on failure
        if: failure()
        run: |
          docker ps -a
          for id in $(docker ps -aq); do
            echo "::group::docker logs $id"
            docker logs --tail 200 "$id" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/*/build/test-results/test
            apps/*/build/reports/tests/test
          retention-days: 7
