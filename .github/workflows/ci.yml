name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Start MongoDB and Redis
        run: docker compose up -d && sleep 5

      - run: ./gradlew test --build-cache
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/stayops-test?replicaSet=rs0
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          TOSS_PAYMENTS_SECRET_KEY: test_sk_test_key
          TOSS_PAYMENTS_BASE_URL: https://api.tosspayments.com/v1/payments
