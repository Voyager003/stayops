name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      topology:
        description: "Terraform topology to destroy"
        type: choice
        required: true
        default: minimal
        options:
          - minimal
          - production
      confirm:
        description: "Type destroy-minimal or destroy-production"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-destroy-${{ inputs.topology }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: ap-northeast-2
  TERRAFORM_WORKING_DIR: infra/terraform/prod

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production-infra
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Check confirmation
        run: |
          set -euo pipefail
          expected="destroy-${{ inputs.topology }}"
          if [ "${{ inputs.confirm }}" != "$expected" ]; then
            echo "Confirmation must be exactly: ${expected}" >&2
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        env:
          TF_STATE_KEY_PRODUCTION: ${{ secrets.TF_STATE_KEY_PRODUCTION }}
          TF_STATE_KEY_MINIMAL: ${{ secrets.TF_STATE_KEY_MINIMAL }}
          TF_STATE_KEY_LEGACY: ${{ secrets.TF_STATE_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.topology }}" = "minimal" ]; then
            state_key="${TF_STATE_KEY_MINIMAL}"
          else
            state_key="${TF_STATE_KEY_PRODUCTION:-${TF_STATE_KEY_LEGACY}}"
          fi

          if [ -z "$state_key" ]; then
            echo "Terraform state key is not configured for topology=${{ inputs.topology }}" >&2
            exit 1
          fi

          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${state_key}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Write tfvars
        env:
          TFVARS_PRODUCTION: ${{ secrets.TFVARS_PRODUCTION }}
          TFVARS_MINIMAL: ${{ secrets.TFVARS_MINIMAL }}
          TFVARS_PROD_LEGACY: ${{ secrets.TFVARS_PROD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.topology }}" = "minimal" ]; then
            tfvars="${TFVARS_MINIMAL}"
          else
            tfvars="${TFVARS_PRODUCTION:-${TFVARS_PROD_LEGACY}}"
          fi

          if [ -z "$tfvars" ]; then
            echo "Terraform tfvars secret is not configured for topology=${{ inputs.topology }}" >&2
            exit 1
          fi

          printf '%s' "$tfvars" > prod.tfvars

      - name: Terraform plan destroy
        run: terraform plan -destroy -var-file=prod.tfvars -out=tfplan-destroy

      - name: Terraform destroy
        run: terraform apply tfplan-destroy
