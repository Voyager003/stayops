name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: ap-northeast-2
  ARTIFACT_PREFIX: app/${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Start MongoDB and Redis
        run: docker compose up -d mongodb mongo-init redis && sleep 5

      - name: Download dependencies
        run: ./gradlew :apps:stayops-api:dependencies :apps:mock-ota:dependencies --no-daemon

      - name: Run tests
        run: ./gradlew test --build-cache --no-daemon

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stayops-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set mock-ota image name
        run: echo "MOCK_OTA_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-mock-ota" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mock-ota/Dockerfile
          push: true
          tags: |
            ${{ env.MOCK_OTA_IMAGE }}:latest
            ${{ env.MOCK_OTA_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=mock-ota
          cache-to: type=gha,mode=max,scope=mock-ota

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve artifact bucket
        run: |
          set -euo pipefail
          if [ -n "${{ vars.BOOTSTRAP_ARTIFACT_BUCKET }}" ]; then
            echo "ARTIFACT_BUCKET=${{ vars.BOOTSTRAP_ARTIFACT_BUCKET }}" >> "$GITHUB_ENV"
          else
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            echo "ARTIFACT_BUCKET=stayops-prod-artifacts-${account_id}" >> "$GITHUB_ENV"
          fi

      - name: Build app bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/stayops-bundles
          tar -czf /tmp/stayops-bundles/app.tgz \
            -C infra/production/app \
            docker-compose.yml docker-compose.agent.yml promtail.yml

      - name: Upload app bundle
        run: |
          set -euo pipefail
          aws s3 cp infra/production/scripts/install-compose-stack.sh "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/install-compose-stack.sh"
          aws s3 cp /tmp/stayops-bundles/app.tgz "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/app.tgz"

      - name: Deploy app via SSM Run Command
        run: |
          set -euo pipefail

          ids_raw="$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)"

          if [ -z "$ids_raw" ]; then
            echo "No running app instances found" >&2
            exit 1
          fi

          read -r -a ids <<< "$ids_raw"

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/install-compose-stack.sh /tmp/install-compose-stack.sh",
              "chmod +x /tmp/install-compose-stack.sh",
              "sudo /tmp/install-compose-stack.sh 'app' '${ARTIFACT_BUCKET}' '${ARTIFACT_PREFIX}/app.tgz' '/stayops/prod/app' '/opt/stayops/app' 'docker-compose.yml:docker-compose.agent.yml'"
            ]
          }
          EOF

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --comment "StayOps app deploy ${GITHUB_SHA}" \
            --instance-ids "${ids[@]}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)"

          for id in "${ids[@]}"; do
            aws ssm wait command-executed --command-id "$command_id" --instance-id "$id"
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$id" \
              --query "{InstanceId:InstanceId,Status:Status,ResponseCode:ResponseCode}" \
              --output table
          done
