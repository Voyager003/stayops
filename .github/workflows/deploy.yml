name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-destroy.yml'
      - '.github/workflows/bootstrap-deploy.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: stayops-app-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ARTIFACT_PREFIX: app/${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Start MongoDB and Redis
        run: docker compose up -d mongodb mongo-init redis && sleep 5

      - name: Download dependencies
        run: ./gradlew :apps:stayops-api:dependencies :apps:mock-ota:dependencies --no-daemon

      - name: Run tests
        run: ./gradlew test --build-cache --no-daemon

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stayops-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set mock-ota image name
        run: echo "MOCK_OTA_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-mock-ota" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mock-ota/Dockerfile
          push: true
          tags: |
            ${{ env.MOCK_OTA_IMAGE }}:latest
            ${{ env.MOCK_OTA_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=mock-ota
          cache-to: type=gha,mode=max,scope=mock-ota

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve artifact bucket
        run: |
          set -euo pipefail
          topology="${{ vars.DEPLOY_TOPOLOGY || 'production' }}"
          if [ "$topology" = "minimal" ]; then
            echo "DEPLOY_TOPOLOGY=minimal" >> "$GITHUB_ENV"
            echo "TARGET_NAME_PREFIX=stayops-minimal" >> "$GITHUB_ENV"
            default_bucket_prefix="stayops-minimal-artifacts"
          else
            echo "DEPLOY_TOPOLOGY=production" >> "$GITHUB_ENV"
            echo "TARGET_NAME_PREFIX=stayops-prod" >> "$GITHUB_ENV"
            default_bucket_prefix="stayops-prod-artifacts"
          fi
          if [ "$topology" = "minimal" ] && [ -n "${{ vars.BOOTSTRAP_ARTIFACT_BUCKET_MINIMAL }}" ]; then
            echo "ARTIFACT_BUCKET=${{ vars.BOOTSTRAP_ARTIFACT_BUCKET_MINIMAL }}" >> "$GITHUB_ENV"
          elif [ "$topology" = "production" ] && [ -n "${{ vars.BOOTSTRAP_ARTIFACT_BUCKET_PRODUCTION }}" ]; then
            echo "ARTIFACT_BUCKET=${{ vars.BOOTSTRAP_ARTIFACT_BUCKET_PRODUCTION }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.BOOTSTRAP_ARTIFACT_BUCKET }}" ]; then
            echo "ARTIFACT_BUCKET=${{ vars.BOOTSTRAP_ARTIFACT_BUCKET }}" >> "$GITHUB_ENV"
          else
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            echo "ARTIFACT_BUCKET=${default_bucket_prefix}-${account_id}" >> "$GITHUB_ENV"
          fi

      - name: Build app bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/stayops-bundles
          tar -czf /tmp/stayops-bundles/app.tgz \
            -C infra/production/app \
            docker-compose.yml docker-compose.agent.yml promtail.yml
          tar -czf /tmp/stayops-bundles/minimal-app.tgz \
            -C infra/minimal/app \
            docker-compose.yml nginx.conf.template

      - name: Upload app bundle
        run: |
          set -euo pipefail
          aws s3 cp infra/production/scripts/install-compose-stack.sh "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/install-compose-stack.sh"
          aws s3 cp /tmp/stayops-bundles/app.tgz "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/app.tgz"
          aws s3 cp /tmp/stayops-bundles/minimal-app.tgz "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/minimal-app.tgz"

      - name: Deploy app via rolling SSM Run Command
        run: |
          set -euo pipefail

          app_image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"

          print_command_output() {
            local command_id="$1"
            local id="$2"

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$id" \
              --query "{InstanceId:InstanceId,Status:Status,ResponseCode:ResponseCode}" \
              --output table

            echo "::group::SSM stdout ${id}"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$id" \
              --query "StandardOutputContent" \
              --output text || true
            echo "::endgroup::"

            echo "::group::SSM stderr ${id}"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$id" \
              --query "StandardErrorContent" \
              --output text || true
            echo "::endgroup::"
          }

          if [ "${DEPLOY_TOPOLOGY}" = "minimal" ]; then
            ids_raw="$(aws ec2 describe-instances \
              --filters "Name=tag:Role,Values=minimal-app" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text)"

            if [ -z "$ids_raw" ]; then
              echo "No running minimal app instances found" >&2
              exit 1
            fi

            cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/install-compose-stack.sh /tmp/install-compose-stack.sh",
              "chmod +x /tmp/install-compose-stack.sh",
              "sudo /tmp/install-compose-stack.sh 'minimal-app' '${ARTIFACT_BUCKET}' '${ARTIFACT_PREFIX}/minimal-app.tgz' '/stayops/minimal/app' '/opt/stayops/minimal-app' 'docker-compose.yml' '${app_image}'"
            ]
          }
          EOF

            read -r -a minimal_ids <<< "$ids_raw"
            for id in "${minimal_ids[@]}"; do
              command_id="$(aws ssm send-command \
                --document-name AWS-RunShellScript \
                --comment "StayOps minimal app deploy ${GITHUB_SHA} ${id}" \
                --instance-ids "$id" \
                --parameters file:///tmp/ssm-params.json \
                --query "Command.CommandId" \
                --output text)"

              if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "$id"; then
                print_command_output "$command_id" "$id"
                exit 1
              fi

              print_command_output "$command_id" "$id"
            done

            exit 0
          fi

          target_group_arn="$(aws elbv2 describe-target-groups \
            --names "${TARGET_NAME_PREFIX}-app-tg" \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)"

          ids_raw="$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].join(' ', [Tags[?Key=='Name']|[0].Value, InstanceId])" \
            --output text)"

          if [ -z "$ids_raw" ]; then
            echo "No running app instances found" >&2
            exit 1
          fi

          mapfile -t ids < <(printf '%s\n' "$ids_raw" | sort | awk '{print $2}')

          if [ "${#ids[@]}" -lt 2 ]; then
            echo "Rolling deploy requires at least two running app instances" >&2
            exit 1
          fi

          healthy_count="$(aws elbv2 describe-target-health \
            --target-group-arn "$target_group_arn" \
            --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
            --output text)"

          if [ "$healthy_count" -lt 2 ]; then
            echo "Rolling deploy requires at least two healthy app targets, current=${healthy_count}" >&2
            exit 1
          fi

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/install-compose-stack.sh /tmp/install-compose-stack.sh",
              "chmod +x /tmp/install-compose-stack.sh",
              "sudo /tmp/install-compose-stack.sh 'app' '${ARTIFACT_BUCKET}' '${ARTIFACT_PREFIX}/app.tgz' '/stayops/prod/app' '/opt/stayops/app' 'docker-compose.yml:docker-compose.agent.yml' '${app_image}'"
            ]
          }
          EOF

          for id in "${ids[@]}"; do
            echo "Deregister ${id} from ALB target group"
            aws elbv2 deregister-targets \
              --target-group-arn "$target_group_arn" \
              --targets Id="$id"
            aws elbv2 wait target-deregistered \
              --target-group-arn "$target_group_arn" \
              --targets Id="$id"

            remaining_healthy_count="$(aws elbv2 describe-target-health \
              --target-group-arn "$target_group_arn" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
              --output text)"

            if [ "$remaining_healthy_count" -lt 1 ]; then
              echo "No healthy app target remains after deregistering ${id}" >&2
              exit 1
            fi

            command_id="$(aws ssm send-command \
              --document-name AWS-RunShellScript \
              --comment "StayOps rolling app deploy ${GITHUB_SHA} ${id}" \
              --instance-ids "$id" \
              --parameters file:///tmp/ssm-params.json \
              --query "Command.CommandId" \
              --output text)"

            if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "$id"; then
              print_command_output "$command_id" "$id"
              echo "SSM deployment did not complete successfully for ${id}" >&2
              exit 1
            fi

            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$id" \
              --query "Status" \
              --output text)"

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$id" \
              --query "{InstanceId:InstanceId,Status:Status,ResponseCode:ResponseCode}" \
              --output table

            if [ "$status" != "Success" ]; then
              echo "SSM deployment failed for ${id}" >&2
              exit 1
            fi

            echo "Register ${id} back to ALB target group"
            aws elbv2 register-targets \
              --target-group-arn "$target_group_arn" \
              --targets Id="$id"
            aws elbv2 wait target-in-service \
              --target-group-arn "$target_group_arn" \
              --targets Id="$id"
          done
