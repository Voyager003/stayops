services:
  app:
    image: ghcr.io/voyager003/stayops:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_MONGODB_URI=${SPRING_MONGODB_URI}
      - SPRING_DATA_REDIS_HOST=redis
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stayops-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stayops-net

  mock-ota:
    image: ghcr.io/voyager003/stayops-mock-ota:latest
    environment:
      - MOCK_OTA_PMS_WEBHOOK_URL=http://app:8080/api/v1/properties/{propertyId}/channels/webhook/{channelCode}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - stayops-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - stayops-net

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - stayops-net

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - stayops-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - stayops-net

volumes:
  redis_data:
  loki_data:
  grafana_data:

networks:
  stayops-net:
    driver: bridge
