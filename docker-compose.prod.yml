services:
  app:
    image: ghcr.io/voyager003/stayops:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_MONGODB_URI=${SPRING_MONGODB_URI}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - MOCK_OTA_ENDPOINT=${MOCK_OTA_ENDPOINT}
      - STAYOPS_PAYMENT_GATEWAY=${STAYOPS_PAYMENT_GATEWAY:-toss}
      - STAYOPS_PAYMENT_LOADTEST_LATENCY_MS=${STAYOPS_PAYMENT_LOADTEST_LATENCY_MS:-0}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - stayops-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stayops-net

  mock-ota:
    image: ghcr.io/voyager003/stayops-mock-ota:latest
    environment:
      - MOCK_OTA_PMS_WEBHOOK_URL=http://app:8080/api/v1/properties/{propertyId}/channels/webhook/{channelCode}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - stayops-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - stayops-net

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - stayops-net

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - stayops-net

  prometheus:
    image: prom/prometheus:latest
    entrypoint:
      - /bin/sh
      - -c
    command:
      - 'sed -e "s|\$${MONGO1_HOST}|$${MONGO1_HOST}|g" -e "s|\$${MONGO2_HOST}|$${MONGO2_HOST}|g" -e "s|\$${MONGO3_HOST}|$${MONGO3_HOST}|g" /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --web.enable-lifecycle --web.enable-remote-write-receiver'
    environment:
      MONGO1_HOST: ${MONGO1_HOST}
      MONGO2_HOST: ${MONGO2_HOST}
      MONGO3_HOST: ${MONGO3_HOST}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/production/app/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - stayops-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - stayops-net

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - stayops-net

volumes:
  redis_data:
  loki_data:
  grafana_data:
  prometheus_data:

networks:
  stayops-net:
    driver: bridge
