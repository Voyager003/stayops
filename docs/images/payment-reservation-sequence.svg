<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1620" width="1660" height="1620" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/>
    </marker>
    <marker id="reply" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1660" height="1620" fill="#FFFFFF"/>

  <!-- ===== diagram frame ===== -->
  <rect x="24" y="24" width="1612" height="1564" fill="none" stroke="#374151" stroke-width="1.8"/>
  <path d="M 24 24 L 330 24 L 330 46 L 312 66 L 24 66 Z" fill="#EEF1F5" stroke="#374151" stroke-width="1.8"/>
  <text x="42" y="51" font-size="14" font-weight="700" fill="#1F2937">sd  결제 승인 → 예약 확정</text>

  <!-- ===== lifelines ===== -->
  <line x1="100"  y1="156" x2="100"  y2="1396" stroke="#9AA3B0" stroke-width="1.3" stroke-dasharray="6 6"/>
  <line x1="420"  y1="156" x2="420"  y2="1396" stroke="#9AA3B0" stroke-width="1.3" stroke-dasharray="6 6"/>
  <line x1="810"  y1="156" x2="810"  y2="1396" stroke="#9AA3B0" stroke-width="1.3" stroke-dasharray="6 6"/>
  <line x1="1190" y1="156" x2="1190" y2="1396" stroke="#9AA3B0" stroke-width="1.3" stroke-dasharray="6 6"/>
  <line x1="1520" y1="156" x2="1520" y2="1396" stroke="#9AA3B0" stroke-width="1.3" stroke-dasharray="6 6"/>

  <!-- actor -->
  <circle cx="100" cy="86" r="9" fill="none" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="100" y1="95"  x2="100" y2="117" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="80"  y1="103" x2="120" y2="103" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="100" y1="117" x2="87"  y2="134" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="100" y1="117" x2="113" y2="134" stroke="#1F2937" stroke-width="1.8"/>
  <text x="100" y="150" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle">고객</text>

  <!-- lifeline heads -->
  <rect x="304" y="104" width="232" height="46" fill="#EEF1F5" stroke="#374151" stroke-width="1.6"/>
  <text x="420" y="133" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle">:StayOpsApi</text>

  <rect x="700" y="104" width="220" height="46" fill="#EEF1F5" stroke="#374151" stroke-width="1.6"/>
  <text x="810" y="133" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle">:PostgreSQL</text>

  <rect x="1058" y="104" width="264" height="46" fill="#EEF1F5" stroke="#374151" stroke-width="1.6"/>
  <text x="1190" y="133" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle">:PaymentOutboxWorker</text>

  <rect x="1400" y="104" width="228" height="46" fill="#EEF1F5" stroke="#374151" stroke-width="1.6"/>
  <text x="1514" y="133" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle">:PaymentGateway</text>

  <!-- ===== execution specifications ===== -->
  <rect x="415" y="196" width="10" height="196" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="805" y="256" width="10" height="96"  fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="1185" y="464" width="10" height="788" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="1515" y="540" width="10" height="52"  fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="805" y="694" width="10" height="164" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="805" y="956" width="10" height="126" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="1515" y="1154" width="10" height="52" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="805" y="1230" width="10" height="24" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>
  <rect x="415" y="1330" width="10" height="44" fill="#E4EAF2" stroke="#374151" stroke-width="1.2"/>

  <!-- ===== 1 : confirmPayment ===== -->
  <text x="262" y="190" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1: confirmPayment(paymentKey, orderId, amount)</text>
  <line x1="100" y1="196" x2="413" y2="196" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <!-- ===== critical [TX1] ===== -->
  <rect x="346" y="216" width="560" height="142" fill="#F5F8FD" stroke="#1B4F9C" stroke-width="1.7"/>
  <path d="M 346 216 L 452 216 L 452 232 L 438 248 L 346 248 Z" fill="#DCE7F7" stroke="#1B4F9C" stroke-width="1.7"/>
  <text x="360" y="238" font-size="12.5" font-weight="700" fill="#1B4F9C">critical</text>
  <text x="466" y="238" font-size="12.5" font-weight="600" fill="#1B4F9C">[TX1 · 상태 변경과 작업 기록을 한 트랜잭션에 저장]</text>

  <text x="615" y="264" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1.1: save(ReservationIntent: CONFIRM_REQUESTED)</text>
  <line x1="427" y1="270" x2="803" y2="270" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="615" y="302" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1.2: save(Payment: CONFIRM_REQUESTED, paymentKey)</text>
  <line x1="427" y1="308" x2="803" y2="308" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="615" y="340" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">1.3: save(PaymentOutbox: CONFIRM_PAYMENT, idempotencyKey)</text>
  <line x1="427" y1="346" x2="803" y2="346" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <!-- ===== 2 : reply 202 ===== -->
  <text x="262" y="386" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">2: 202 Accepted — 요청 접수 (예약은 아직 미확정)</text>
  <line x1="413" y1="392" x2="103" y2="392" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#reply)"/>

  <!-- ===== loop ===== -->
  <rect x="740" y="420" width="860" height="866" fill="none" stroke="#6B7280" stroke-width="1.7"/>
  <path d="M 740 420 L 826 420 L 826 436 L 812 452 L 740 452 Z" fill="#EEF1F5" stroke="#6B7280" stroke-width="1.7"/>
  <text x="754" y="442" font-size="12.5" font-weight="700" fill="#374151">loop</text>
  <text x="840" y="442" font-size="12.5" font-weight="600" fill="#374151">[5초 주기 · 1회 최대 100건]</text>

  <text x="1000" y="466" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">3: claimReadyForProcessing(workerId, lockedUntil)</text>
  <line x1="1183" y1="472" x2="817" y2="472" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="504" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">3.1: outboxMessage — FOR UPDATE SKIP LOCKED · lease 60초</text>
  <line x1="817" y1="510" x2="1183" y2="510" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#reply)"/>

  <text x="1355" y="540" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">4: confirm(paymentKey, idempotencyKey)</text>
  <line x1="1197" y1="546" x2="1513" y2="546" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1355" y="578" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">4.1: confirmResult</text>
  <line x1="1513" y1="584" x2="1199" y2="584" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#reply)"/>

  <!-- ===== alt ===== -->
  <rect x="766" y="606" width="808" height="656" fill="none" stroke="#374151" stroke-width="1.7"/>
  <path d="M 766 606 L 838 606 L 838 622 L 824 638 L 766 638 Z" fill="#EEF1F5" stroke="#374151" stroke-width="1.7"/>
  <text x="780" y="628" font-size="12.5" font-weight="700" fill="#1F2937">alt</text>
  <text x="852" y="628" font-size="12.5" font-weight="700" fill="#1E7A3E">[승인 성공 · orderId와 금액 일치]</text>

  <!-- operand 1 : critical TX2 성공 -->
  <rect x="792" y="652" width="756" height="212" fill="#F3FAF5" stroke="#1E7A3E" stroke-width="1.6"/>
  <path d="M 792 652 L 898 652 L 898 668 L 884 684 L 792 684 Z" fill="#DBF0E3" stroke="#1E7A3E" stroke-width="1.6"/>
  <text x="806" y="674" font-size="12.5" font-weight="700" fill="#1E7A3E">critical</text>
  <text x="912" y="674" font-size="12.5" font-weight="600" fill="#1E7A3E">[TX2 · 하나라도 실패하면 전체 롤백]</text>

  <text x="1000" y="696" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5a.1: save(Payment: APPROVED)</text>
  <line x1="1183" y1="702" x2="817" y2="702" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="734" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5a.2: consumeHold() — 점유 재고를 예약 재고로 전환</text>
  <line x1="1183" y1="740" x2="817" y2="740" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="772" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5a.3: save(Reservation) — 요금 스냅샷을 그대로 승계</text>
  <line x1="1183" y1="778" x2="817" y2="778" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="810" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5a.4: save(ReservationIntent: RESERVED, reservationId)</text>
  <line x1="1183" y1="816" x2="817" y2="816" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="848" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5a.5: save(PaymentOutbox: COMPLETED) — version 검사</text>
  <line x1="1183" y1="854" x2="817" y2="854" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <!-- operand separator 1 -->
  <line x1="766" y1="886" x2="1574" y2="886" stroke="#374151" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="784" y="908" font-size="12.5" font-weight="700" fill="#9C2C27">[else · 승인 거절]</text>

  <!-- operand 2 : critical TX2 실패 -->
  <rect x="792" y="920" width="756" height="174" fill="#FDF6F5" stroke="#B4342F" stroke-width="1.6"/>
  <path d="M 792 920 L 898 920 L 898 936 L 884 952 L 792 952 Z" fill="#F8E3E1" stroke="#B4342F" stroke-width="1.6"/>
  <text x="806" y="942" font-size="12.5" font-weight="700" fill="#9C2C27">critical</text>
  <text x="912" y="942" font-size="12.5" font-weight="600" fill="#9C2C27">[TX2 · Reservation을 생성하지 않음]</text>

  <text x="1000" y="964" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5b.1: save(Payment: FAILED)</text>
  <line x1="1183" y1="970" x2="817" y2="970" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="1002" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5b.2: releaseHold() — 점유 재고를 판매 가능 상태로 복구</text>
  <line x1="1183" y1="1008" x2="817" y2="1008" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="1040" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5b.3: save(ReservationIntent: PAYMENT_FAILED)</text>
  <line x1="1183" y1="1046" x2="817" y2="1046" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1000" y="1078" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5b.4: save(PaymentOutbox: COMPLETED)</text>
  <line x1="1183" y1="1084" x2="817" y2="1084" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <!-- operand separator 2 -->
  <line x1="766" y1="1112" x2="1574" y2="1112" stroke="#374151" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="784" y="1134" font-size="12.5" font-weight="700" fill="#A9660A">[else · 응답 불명 또는 일시 오류]</text>

  <!-- operand 3 -->
  <text x="1355" y="1154" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5c.1: inquire(paymentKey)</text>
  <line x1="1197" y1="1160" x2="1513" y2="1160" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="1355" y="1192" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">5c.2: inquiryResult — DONE이면 5a로 복구</text>
  <line x1="1513" y1="1198" x2="1199" y2="1198" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#reply)"/>

  <text x="1000" y="1230" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">5c.3: save(Outbox: PENDING, nextRetryAt) — 최대 3회 · 30·60·120초</text>
  <line x1="1183" y1="1236" x2="817" y2="1236" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <!-- ===== 6 : 상태 조회 ===== -->
  <text x="262" y="1324" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">6: getReservationIntent(reservationIntentId)</text>
  <line x1="100" y1="1330" x2="413" y2="1330" stroke="#1F2937" stroke-width="1.7" marker-end="url(#sync)"/>

  <text x="262" y="1368" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">6.1: RESERVED · APPROVED — 예약 확정 확인</text>
  <line x1="413" y1="1374" x2="103" y2="1374" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#reply)"/>

  <!-- ===== note ===== -->
  <path d="M 64 1420 L 764 1420 L 764 1552 L 64 1552 Z" fill="#FBFBFC" stroke="#9AA3B0" stroke-width="1.4"/>
  <path d="M 744 1420 L 764 1420 L 764 1440 Z" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.4"/>
  <text x="82" y="1448" font-size="11.8" fill="#4B5563">사전 조건 · ReservationIntent, Payment(PENDING), InventoryHold(점유) 생성 완료</text>
  <text x="82" y="1476" font-size="11.8" fill="#4B5563">1과 6은 서로 다른 요청이며, 사이의 처리는 응답 이후 비동기로 진행됨</text>
  <text x="82" y="1504" font-size="11.8" fill="#4B5563">결제 제한 시간이 만료되면 별도 스케줄러가 Intent를 EXPIRED로 두고 점유를 복구</text>
  <text x="82" y="1532" font-size="11.8" fill="#4B5563">5a가 PG 승인 후 실패하면 CANCEL_PAYMENT 작업을 Outbox에 기록해 환불을 재시도</text>
</svg>
