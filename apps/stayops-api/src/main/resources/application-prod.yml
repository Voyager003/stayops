spring:
  application:
    name: stayops
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

stayops:
  instance-id: ${STAYOPS_INSTANCE_ID:${HOSTNAME:local}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
    env:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
