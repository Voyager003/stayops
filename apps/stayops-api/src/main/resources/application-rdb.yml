spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stayops}
    username: ${SPRING_DATASOURCE_USERNAME:stayops}
    password: ${SPRING_DATASOURCE_PASSWORD:stayops}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES
