services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    volumes:
      - mongodb_data:/data/db

  mongo-init:
    image: mongo:8
    depends_on:
      - mongodb
    restart: "no"
    entrypoint: >
      mongosh --host mongodb --eval '
        try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }
        catch(e) { if (e.codeName !== "AlreadyInitialized") throw e; }
      '

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mock-ota:
    build:
      context: .
      dockerfile: stayops-mock-ota/Dockerfile
    ports:
      - "8081:8081"
    environment:
      MOCK_OTA_PMS_WEBHOOK_URL: http://app:8080/api/v1/properties/{propertyId}/channels/webhook/{channelCode}

volumes:
  mongodb_data:
  redis_data:
