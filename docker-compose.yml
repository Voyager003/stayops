services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    volumes:
      - mongodb_data:/data/db

  mongo-init:
    image: mongo:8
    depends_on:
      - mongodb
    restart: "no"
    entrypoint: >
      mongosh --host mongodb --eval '
        try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }
        catch(e) { if (e.codeName !== "AlreadyInitialized") throw e; }
      '

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo-ota:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo_ota_data:/data/db

  app:
    build:
      context: .
      dockerfile: apps/stayops-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_MONGODB_URI: mongodb://mongodb:27017/stayops?replicaSet=rs0
      SPRING_DATA_REDIS_HOST: redis
      MOCK_OTA_ENDPOINT: http://mock-ota:8081
    depends_on:
      - mongodb
      - mongo-init
      - redis
    restart: unless-stopped

  mock-ota:
    build:
      context: .
      dockerfile: apps/mock-ota/Dockerfile
    ports:
      - "8081:8081"
    environment:
      MOCK_OTA_PMS_WEBHOOK_URL: http://app:8080/api/v1/properties/{propertyId}/channels/webhook/{channelCode}
      SPRING_DATA_MONGODB_URI: mongodb://mongo-ota:27017/mock-ota
    depends_on:
      - mongo-ota
      - app
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  mongodb_data:
  redis_data:
  mongo_ota_data:
  loki_data:
  grafana_data:
