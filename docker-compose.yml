services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo-ota:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo_ota_data:/data/db

  app:
    build:
      context: .
      dockerfile: apps/stayops-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      MOCK_OTA_ENDPOINT: http://mock-ota:8081
    depends_on:
      - redis
    restart: unless-stopped

  mock-ota:
    build:
      context: .
      dockerfile: apps/mock-ota/Dockerfile
    ports:
      - "8081:8081"
    environment:
      MOCK_OTA_PMS_WEBHOOK_URL: ${MOCK_OTA_PMS_WEBHOOK_URL:-http://host.docker.internal:8080/api/v1/properties/{propertyId}/channels/webhook/{channelCode}}
      SPRING_MONGODB_URI: mongodb://mongo-ota:27017/mock-ota
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo-ota
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  redis_data:
  mongo_ota_data:
  loki_data:
  grafana_data:
