limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream app {
    server app:8080;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.learniverse.store;

    location = /health {
        proxy_pass http://app/actuator/health;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name api.learniverse.store;

    ssl_certificate /etc/letsencrypt/live/api.learniverse.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learniverse.store/privkey.pem;

    client_max_body_size 10m;

    location = /actuator/prometheus {
        return 404;
    }

    location = /mock-ota {
        return 308 /mock-ota/;
    }

    location ~ ^/mock-ota/api/v1/(simulate|ari/clear) {
        rewrite ^/mock-ota/(.*)$ /$1 break;
        proxy_pass http://mock-ota:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /mock-ota/ {
        rewrite ^/mock-ota/(.*)$ /$1 break;
        proxy_pass http://mock-ota:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 1000;

    location / {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
