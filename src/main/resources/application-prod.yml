spring:
  application:
    name: stayops
  mongodb:
    uri: mongodb://mongodb:27017/stayops?replicaSet=rs0
  data:
    redis:
      host: redis
      port: 6379
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    env:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com/v1/payments}
