spring:
  application:
    name: stayops
  data:
    mongodb:
      uri: mongodb://mongodb:27017/stayops?replicaSet=rs0
    redis:
      host: redis
      port: 6379
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com/v1/payments}
