spring:
  application:
    name: stayops
  profiles:
    active: local
  session:
    redis:
      repository-type: default
    timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_sk_default}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com/v1/payments}
