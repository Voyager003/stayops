services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    volumes:
      - mongodb_data:/data/db

  mongo-init:
    image: mongo:8
    depends_on:
      - mongodb
    restart: "no"
    entrypoint: >
      mongosh --host mongodb --eval '
        try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }
        catch(e) { if (e.codeName !== "AlreadyInitialized") throw e; }
      '

  app:
    environment:
      SPRING_PROFILES_ACTIVE: local,mongo
      SPRING_MONGODB_URI: mongodb://mongodb:27017/stayops?replicaSet=rs0
    depends_on:
      - mongodb
      - mongo-init
      - redis

volumes:
  mongodb_data:
